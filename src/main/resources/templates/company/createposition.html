<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create New Traineeship Position</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #5e35b1;
        }

        label {
            font-weight: bold;
            margin-top: 10px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #b39ddb;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #9c8cc1;
        }

        .back-link {
            margin-top: 20px;
            text-align: center;
        }

        .back-link a {
            color: #5e35b1;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Create New Traineeship Position</h2>
    <form th:action="@{/company/createposition}" th:object="${position}" method="post">
        <label for="title">Title</label>
        <input type="text" id="title" th:field="*{title}" required>

        <label for="description">Description</label>
        <textarea id="description" th:field="*{description}" required></textarea>

        <label for="topics">Topics</label>
        <input type="text" id="topics" th:field="*{topics}" required>

        <label for="skills">Skills</label>
        <input type="text" id="skills" th:field="*{skills}" required>

        <label for="fromDate">Start Date</label>
        <input type="date" id="fromDate" th:field="*{fromDate}" required>

        <label for="toDate">End Date</label>
        <input type="date" id="toDate" th:field="*{toDate}" required>

        <button type="submit">Create Position</button>
    </form>

    <div class="back-link">
        <a href="/company/availablepositions">← Back to Advertised Traineeship Positions</a>
    </div>
</div>
</body>
</html>
