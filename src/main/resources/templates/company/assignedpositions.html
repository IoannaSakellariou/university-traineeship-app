<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Assigned Traineeship Positions</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f9;
            padding: 20px;
        }

        h2 {
            color: #5e35b1;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #b39ddb;
            color: white;
        }

        .back-link {
            margin-top: 30px;
            text-align: center;
        }

        .back-link a {
            text-decoration: none;
    		color: #5e35b1;
        }

        .back-link a:hover {
            background-color: #9c8cc1;
        }
    </style>
</head>
<body>

<h2>Assigned Traineeship Positions</h2>

<table>
    <thead>
    <tr>
        <th>Title</th>
        <th>Topics</th>
        <th>Assigned Student</th>
        <th>Student AM</th>
        <th>Status</th>
        <th>Actions</th>
        
    </tr>
    </thead>
    <tbody>
    <tr th:each="pos : ${positions}">
        <td th:text="${pos.title}"></td>
        <td th:text="${pos.topics}"></td>
        <td>
		    <span th:if="${pos.student != null}" th:text="${pos.student.studentName}"></span>
		    <span th:unless="${pos.student != null}">—</span>
		</td>
		<td>
		    <span th:if="${pos.student != null}" th:text="${pos.student.AM}"></span>
		    <span th:unless="${pos.student != null}">—</span>
		</td>

        <td th:text="${pos.completed} ? 'Completed - ' + (${pos.passFailGrade} ? 'PASS' : 'FAIL') : 'In Progress'"></td>
        
        <td>
	        <a th:if="${!pos.completed}" th:href="@{/company/evaluate/{id}(id=${pos.id})}" style="background-color:#5e35b1;color:white;padding:6px 12px;border-radius:5px;text-decoration:none;">
	            Evaluate
	        </a>
	        <span th:if="${pos.completed}">Already Completed</span>
	        
	    </td>
    </tr>
    </tbody>
</table>

<div class="back-link">
    <a href="/company/dashboard">← Back to Dashboard</a>
</div>

</body>
</html>
