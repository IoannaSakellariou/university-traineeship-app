<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Professor Profile</title>
    <link rel="stylesheet" th:href="@{/css/edit.css}">
</head>
<body>

<div class="container">
    <h2>Edit Professor Profile</h2>

    <form action="/professor/edit" method="post" th:object="${professor}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        
        <input type="hidden" th:field="*{id}" />

        <label for="professorName">Name:</label>
        <input type="text" id="professorName" th:field="*{professorName}" required />

        <label for="interests">Interests:</label>
        <textarea id="interests" rows="4" th:field="*{interests}" required></textarea>

        <button type="submit">Save Changes</button>
    </form>

    <div class="back-link">
        <a href="/professor/dashboard">← Back to Dashboard</a>
    </div>
</div>

</body>
</html>
