<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>

<header>
    <h1>Welcome, <span sec:authentication="name"></span>!</h1>
</header>

<div class="container">
    <div class="dashboard-box">
        <h2>Student Dashboard</h2>
        
        <div th:if="${info}" class="alert alert-info" th:text="${info}"></div>
		
		
		        

        <div class="button-group">
            <a href="/student/edit" class="btn">Edit Profile</a>
            <a href="/student/availablepositions" class="btn">Available Positions</a>
            <a href="/student/myapplications" class="btn">My Applications</a>
            <a href="/student/logbook" class="btn">Logbook</a>
            <form action="/logout" method="post" style="margin: 0;">
                <button type="submit" class="btn logout-btn">Logout</button>
            </form>
        </div>

    </div>
</div>

<footer>
    <p>&copy; 2025 TraineeshipApp – All Rights Reserved</p>
</footer>

</body>
</html>
