<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link rel="stylesheet" th:href="@{/css/logreghome.css}">

    <title>Traineeship Application Login</title>
    
    
    
</head>

<body>

<div class="container">
    <div class="form-container">
        <h3>Login</h3>

        <form th:action="@{/login}" method="POST">

            <div class="form-group">
                <input type="text" name="username" class="form-control" placeholder="Username" required />
            </div>

            <div class="form-group">
                <input type="password" name="password" class="form-control" placeholder="Password" required />
            </div>

            <button type="submit" class="btn btn-info btn-block">Login</button>
            <a th:href="@{/register}" class="btn btn-primary btn-block">Register</a>

            <div th:if="${param.error}" class="error-message text-center mt-3">
                Username or Password is invalid.
            </div>

            <div class="text-success text-center mt-2" th:utext="${successMessage}"></div>

        </form>
    </div>
</div>

</body>
</html>
